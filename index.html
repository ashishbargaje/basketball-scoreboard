<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">

</head>

<body>
    <main class="container">
        <section class="points-section">
            <label for="home-points">TEAM 1</label>
            <h1 id="home-points">0</h1>
            <ul>
                <li><button onclick="onePointHome()">+1</button></li>
                <li><button onclick="twoPointsHome()">+2</button></li>
                <li><button onclick="threePointsHome()">+3</button></li>
            </ul>
        </section>
        <section class="points-section">
            <label for="home-points">TEAM 2</label>
            <h1 id="guest-points">0</h1>
            <ul>
                <li><button onclick="onePointGuest()">+1</button></li>
                <li><button onclick="twoPointsGuest()">+2</button></li>
                <li><button onclick="threePointsGuest()">+3</button></li>
            </ul>
        </section>
        <h1 id="leader">LEADER is </h1>
    </main>
    <footer>
        <button id="new-game" onclick="newGame()">New Game</button>
    </footer>
    
    <script src="index.js"></script>
</body>

</html>
